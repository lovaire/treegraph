<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JKT48 Wordle Helper / Solver</title>
    <style>
        :root {
            --jkt-red: #E31E24;
            --jkt-dark: #121213;
            --color-correct: #538D4E;
            --color-present: #B59F3B;
            --color-absent: #3A3A3C;
            --color-default: #FFFFFF;
            --bg-card: #1E1E1F;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        body {
            background-color: var(--jkt-dark);
            color: var(--color-default);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header { text-align: center; margin-bottom: 20px; }
        h1 { color: var(--jkt-red); font-size: 1.8rem; text-transform: uppercase; letter-spacing: 2px; }
        .subtitle { color: #aaa; font-size: 0.9rem; margin-top: 5px; }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 10px;
            padding: 15px;
            border: 1px solid #333;
        }

        .section-title {
            font-size: 0.9rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        /* Length Selector */
        .length-selector {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .len-btn {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .len-btn.active {
            background-color: var(--jkt-red);
            border-color: var(--jkt-red);
        }

        /* Input Grid */
        .input-grid {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 10px 0;
        }

        .tile-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .tile {
            width: 50px;
            height: 50px;
            border: 2px solid #555;
            background-color: var(--color-absent);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 4px;
        }

        .tile input {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            color: white;
            text-align: center;
            font-size: 1.8rem;
            font-weight: bold;
            text-transform: uppercase;
            outline: none;
            cursor: pointer;
        }

        .tile.state-1 { background-color: var(--color-correct); border-color: var(--color-correct); }
        .tile.state-2 { background-color: var(--color-present); border-color: var(--color-present); }
        
        .state-label {
            font-size: 0.7rem;
            color: #888;
            text-align: center;
        }

        .hint {
            font-size: 0.8rem;
            color: #aaa;
            text-align: center;
            margin-top: 5px;
            font-style: italic;
        }

        /* Results */
        .stats-grid {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .stat-badge {
            background: #333;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .stat-badge .letter { font-weight: bold; color: var(--jkt-red); font-size: 1.1rem; }

        .results-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .result-tag {
            background-color: #2A2A2C;
            border: 1px solid #444;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.95rem;
            text-transform: capitalize;
        }

        .no-result {
            color: #ff6b6b;
            text-align: center;
            padding: 20px;
            font-weight: bold;
        }

        .reset-btn {
            background-color: #333;
            color: white;
            border: 1px solid #555;
            padding: 10px;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .reset-btn:hover { background-color: #444; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #121213; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        @media (max-width: 500px) {
            .tile { width: 40px; height: 40px; }
            .tile input { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>JKT48 Wordle Helper</h1>
        <div class="subtitle">Alat bantu filter tebak nama member (aktif & ex)</div>
    </header>

    <div class="container">
        <!-- Step 1: Length -->
        <div class="card">
            <div class="section-title">1. Pilih Jumlah Huruf</div>
            <div class="length-selector" id="lengthSelector"></div>
        </div>

        <!-- Step 2: Input -->
        <div class="card">
            <div class="section-title">2. Masukkan Clue & Klik Kotak untuk Ubah Warna</div>
            <div class="input-grid" id="inputGrid"></div>
            <div class="hint">💡 Klik kotak untuk ubah status: ⬜ Abu (tidak ada) → 🟩 Hijau (tepat) → 🟨 Kuning (salah posisi)</div>
            <button class="reset-btn" onclick="resetGrid()">Reset Kotak</button>
        </div>

        <!-- Step 3: Results -->
        <div class="card">
            <div class="section-title">3. Hasil Filter & Saran Huruf</div>
            <div id="suggestionArea" style="margin-bottom: 15px;"></div>
            <div class="section-title" style="font-size: 0.8rem;">Nama yang mungkin (<span id="countDisplay">0</span>):</div>
            <div class="results-list" id="resultsList"></div>
        </div>
    </div>

    <script>
        // Database nama panggilan (unik, lowercase, 2-9 huruf)
        const rawNames = [
            "icha","mova","ayana","akicha","beby","cindy","cleo","delima","kinal","diasta","fira","frieska","gaby","ghaida","haruka","intania","jeje","ve","melody","nabilah","ochi","rena","dhike","rica","sendy","shanju","gaya","sonia","sonya","stella",
            "acha","althea","nichan","yupi","della","delli","dena","uty","shafa","kariin","hanna","rachel","lidya","dhifa","nadila","nat","noella","nobi","imoy","octi","olive","sisil","viny","ikha","rona","saktia","naomi","sinka","tata","vanka","yona","chikarina",
            "feni","cia","manda","andela","anggie","anin","okta","chika","elaine","farina","sisca","indah","kei","desy","grace","michelle","milen","nadse","aurel","nina","pipit","farin","yukka","afa","shani","gracia","sofia","stefi","angel","tya","cesen","zebi",
            "lisa","christi","cinhap","fia","jessica","jinan","devi","mega","melati","lintang","celine","yuri",
            "zara","anggi","citra","chintya","diani","ori","eve","aby","kyla","helma","aya","pucchi","gina","sanda","ruth","julie","violet",
            "gita","ella","tasya","ariel","denise","erika","sintia","ciel","jee","indy","riri","nanda","amel","shalza",
            "christy","olla","freya","eli","jessi","muthe","aiko","yori","zee","lea","dey","febi","bri","brielle","jesslyn","kanya","lala","rifa","vivi",
            "oniel","fiony","lulu","afiqah","mira","nunu","devytha","erichan","flora","vany","keisya","ratu","pamela","reva","adel","alma","ume","ara",
            "kathrina","marsha","ashel","caithlyn","chalista","abel","iris","nabila","olivia","zahra","shinta","tiara",
            "lia","lyn","raisha","abieza","giselle","amanda","callie","danessa","indira","naura",
            "anindya","elin","cynthia","danella","daisy","gracie","greesel","michie","alya","aulia","cathy","chelsea","gendis","jeane",
            "aralie","delynn","lana","erine","fritzy","lily","trisha","kimmy","nala","ribka","oline","nachia","nayla","levi","shasa","regie","moreen",
            "virgi","rilly","giaa","maira","ekin","jemima","mikaela","intan","auwia",
            "fera","carissa","bella","fahira","rara","heidi","maxine","jazzy","ralyne","sona","maegan",
            "sayaya","kanaia","tana","pia","sami","maura","isha"
        ];

        const VALID_WORDS = [...new Set(rawNames)].filter(n => /^[a-z]+$/.test(n) && n.length >= 2 && n.length <= 9);
        
        // Cari panjang unik yang tersedia
        const availableLengths = [...new Set(VALID_WORDS.map(w => w.length))].sort((a,b) => a-b);

        let currentLength = availableLengths.includes(5) ? 5 : availableLengths[0];
        let gridState = []; // { letter: '', state: 0 } (0=gray, 1=green, 2=yellow)

        const lengthSelector = document.getElementById('lengthSelector');
        const inputGrid = document.getElementById('inputGrid');
        const resultsList = document.getElementById('resultsList');
        const countDisplay = document.getElementById('countDisplay');
        const suggestionArea = document.getElementById('suggestionArea');

        function init() {
            // Render length buttons
            availableLengths.forEach(len => {
                const btn = document.createElement('button');
                btn.className = `len-btn ${len === currentLength ? 'active' : ''}`;
                btn.textContent = `${len} Huruf`;
                btn.onclick = () => setLength(len);
                lengthSelector.appendChild(btn);
            });
            buildGrid();
            filterAndRender();
        }

        function setLength(len) {
            currentLength = len;
            document.querySelectorAll('.len-btn').forEach(b => {
                b.classList.toggle('active', b.textContent.includes(len));
            });
            buildGrid();
            filterAndRender();
        }

        function buildGrid() {
            inputGrid.innerHTML = '';
            gridState = [];
            for (let i = 0; i < currentLength; i++) {
                gridState.push({ letter: '', state: 0 });
                
                const container = document.createElement('div');
                container.className = 'tile-container';
                
                const tile = document.createElement('div');
                tile.className = 'tile state-0';
                tile.id = `tile-${i}`;
                tile.onclick = () => cycleState(i);
                
                const input = document.createElement('input');
                input.type = 'text';
                input.maxLength = 1;
                input.id = `input-${i}`;
                input.oninput = (e) => handleInput(i, e);
                input.onkeydown = (e) => handleKeydown(i, e);
                
                tile.appendChild(input);
                
                const label = document.createElement('div');
                label.className = 'state-label';
                label.id = `label-${i}`;
                label.textContent = 'Abu';
                
                container.appendChild(tile);
                container.appendChild(label);
                inputGrid.appendChild(container);
            }
        }

        function cycleState(index) {
            // 0 (Abu) -> 1 (Hijau) -> 2 (Kuning) -> 0
            gridState[index].state = (gridState[index].state + 1) % 3;
            updateTileVisual(index);
            filterAndRender();
        }

        function updateTileVisual(index) {
            const tile = document.getElementById(`tile-${index}`);
            const label = document.getElementById(`label-${index}`);
            const state = gridState[index].state;
            
            tile.className = `tile state-${state}`;
            if (state === 0) {
                tile.style.backgroundColor = 'var(--color-absent)';
                tile.style.borderColor = '#555';
                label.textContent = 'Abu';
            } else if (state === 1) {
                tile.style.backgroundColor = 'var(--color-correct)';
                tile.style.borderColor = 'var(--color-correct)';
                label.textContent = 'Hijau';
            } else {
                tile.style.backgroundColor = 'var(--color-present)';
                tile.style.borderColor = 'var(--color-present)';
                label.textContent = 'Kuning';
            }
        }

        function handleInput(index, e) {
            const val = e.target.value.toLowerCase();
            if (/^[a-z]$/.test(val)) {
                gridState[index].letter = val;
                // Auto-advance to next input
                if (index < currentLength - 1) {
                    document.getElementById(`input-${index + 1}`).focus();
                }
            } else {
                gridState[index].letter = '';
                e.target.value = '';
            }
            filterAndRender();
        }

        function handleKeydown(index, e) {
            if (e.key === 'Backspace' && gridState[index].letter === '' && index > 0) {
                document.getElementById(`input-${index - 1}`).focus();
            }
        }

        function resetGrid() {
            gridState.forEach((_, i) => {
                gridState[i] = { letter: '', state: 0 };
                document.getElementById(`input-${i}`).value = '';
                updateTileVisual(i);
            });
            filterAndRender();
        }

        function filterAndRender() {
            const filtered = VALID_WORDS.filter(word => {
                if (word.length !== currentLength) return false;

                // Hitung frekuensi huruf di kandidat kata
                const wordCounts = {};
                for (const char of word) {
                    wordCounts[char] = (wordCounts[char] || 0) + 1;
                }

                // Cek constraint Hijau & Kuning dulu untuk tahu berapa huruf yang "wajib" ada
                const requiredCounts = {};
                for (let i = 0; i < currentLength; i++) {
                    const { letter, state } = gridState[i];
                    if (!letter) continue;

                    if (state === 1) { // Hijau
                        if (word[i] !== letter) return false;
                        requiredCounts[letter] = (requiredCounts[letter] || 0) + 1;
                    } else if (state === 2) { // Kuning
                        if (word[i] === letter) return false; // Tidak boleh di posisi ini
                        if (!word.includes(letter)) return false; // Harus ada di kata
                        requiredCounts[letter] = (requiredCounts[letter] || 0) + 1;
                    }
                }

                // Cek constraint Abu
                for (let i = 0; i < currentLength; i++) {
                    const { letter, state } = gridState[i];
                    if (!letter || state !== 0) continue;

                    // Jika abu, total huruf ini di kata tidak boleh melebihi yang sudah diwajibkan (hijau/kuning)
                    // Ini menangani logika duplikat huruf Wordle dengan sempurna
                    const required = requiredCounts[letter] || 0;
                    if (wordCounts[letter] > required) {
                        return false;
                    }
                }

                return true;
            });

            renderResults(filtered);
        }

        function renderResults(filtered) {
            countDisplay.textContent = filtered.length;
            resultsList.innerHTML = '';

            if (filtered.length === 0) {
                resultsList.innerHTML = '<div class="no-result">Tidak ada nama yang cocok. Cek kembali clue hurufmu!</div>';
                suggestionArea.innerHTML = '';
                return;
            }

            // Tampilkan nama (max 50 agar tidak terlalu panjang, tapi tampilkan semua jika < 50)
            const displayList = filtered.slice(0, 100);
            displayList.forEach(name => {
                const tag = document.createElement('div');
                tag.className = 'result-tag';
                tag.textContent = name;
                resultsList.appendChild(tag);
            });

            if (filtered.length > 100) {
                const more = document.createElement('div');
                more.className = 'result-tag';
                more.style.fontStyle = 'italic';
                more.style.color = '#888';
                more.textContent = `...dan ${filtered.length - 100} lainnya`;
                resultsList.appendChild(more);
            }

            // Generate saran huruf (frekuensi huruf dari sisa kandidat)
            const letterFreq = {};
            filtered.forEach(word => {
                const uniqueLetters = [...new Set(word.split(''))];
                uniqueLetters.forEach(char => {
                    letterFreq[char] = (letterFreq[char] || 0) + 1;
                });
            });

            const sortedLetters = Object.entries(letterFreq)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 6); // Top 6 huruf

            suggestionArea.innerHTML = '<div class="section-title" style="font-size: 0.8rem; margin-bottom: 8px;">💡 Saran Huruf Selanjutnya (Paling Sering Muncul):</div>';
            const statsGrid = document.createElement('div');
            statsGrid.className = 'stats-grid';
            
            sortedLetters.forEach(([char, count]) => {
                const badge = document.createElement('div');
                badge.className = 'stat-badge';
                badge.innerHTML = `<span class="letter">${char.toUpperCase()}</span> <span style="color:#aaa; font-size:0.8rem;">(${count} nama)</span>`;
                statsGrid.appendChild(badge);
            });
            suggestionArea.appendChild(statsGrid);
        }

        // Start
        init();
    </script>
</body>
</html>
